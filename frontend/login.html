<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPL Intelligence — Login</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0f172a;--surface:#1e293b;--surface2:#334155;--accent:#3b82f6;--accent2:#f59e0b;--text:#f1f5f9;--muted:#94a3b8;--green:#22c55e;--red:#ef4444;--border:#334155}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  .login-wrap{width:100%;max-width:460px}
  .login-logo{text-align:center;margin-bottom:32px}
  .login-logo .icon{font-size:48px;margin-bottom:8px}
  .login-logo h1{font-size:26px;font-weight:800;color:var(--accent)}
  .login-logo h1 span{color:var(--accent2)}
  .login-logo p{color:var(--muted);font-size:14px;margin-top:4px}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px}
  .login-card h2{font-size:20px;font-weight:700;margin-bottom:24px;text-align:center}
  .form-group{margin-bottom:16px}
  .form-group label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
  .form-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 16px;color:var(--text);font-size:14px;outline:none;transition:border .2s}
  .form-input:focus{border-color:var(--accent)}
  .btn-login{width:100%;padding:14px;border-radius:8px;border:none;cursor:pointer;font-size:15px;font-weight:700;background:var(--accent);color:white;transition:all .2s;margin-top:8px}
  .btn-login:hover{background:#2563eb}
  .btn-login:disabled{opacity:.6;cursor:not-allowed}
  .error-msg{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:12px;font-size:13px;color:var(--red);margin-bottom:16px;display:none}
  .success-msg{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:8px;padding:12px;font-size:13px;color:var(--green);margin-bottom:16px;display:none}
  .divider{border:none;border-top:1px solid var(--border);margin:24px 0}
  .quick-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;text-align:center;margin-bottom:12px}
  .team-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
  .team-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 6px;cursor:pointer;text-align:center;transition:all .2s;font-size:11px;font-weight:700;color:var(--muted)}
  .team-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(59,130,246,.1)}
  .team-btn .t-emoji{font-size:20px;display:block;margin-bottom:3px}
  .special-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .role-tags{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap}
  .role-tag{padding:4px 14px;border-radius:20px;font-size:11px;font-weight:600}
  .role-admin{background:rgba(168,85,247,.2);color:#a855f7}
  .role-team{background:rgba(59,130,246,.2);color:var(--accent)}
  .role-analyst{background:rgba(34,197,94,.2);color:var(--green)}
  .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#3b82f6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IPL Intel">
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">
    <div class="icon">🏏</div>
    <h1>IPL <span>Intelligence</span></h1>
    <p>Decision Support System for IPL Teams & Analysts</p>
  </div>
  <div class="login-card">
    <h2>Sign In</h2>
    <div class="error-msg" id="error-msg"></div>
    <div class="success-msg" id="success-msg"></div>
    <div class="form-group">
      <label>Username</label>
      <input class="form-input" id="username" type="text" placeholder="e.g. csk, mi, admin" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input class="form-input" id="password" type="password" placeholder="Enter password" autocomplete="current-password">
    </div>
    <button class="btn-login" id="login-btn" onclick="doLogin()">Sign In</button>
    <hr class="divider">
    <div class="quick-label">Quick Login — Click your team</div>
    <div class="team-grid">
      <div class="team-btn" onclick="quickLogin('csk','csk2025')"><span class="t-emoji">🟡</span>CSK</div>
      <div class="team-btn" onclick="quickLogin('mi','mi2025')"><span class="t-emoji">🔵</span>MI</div>
      <div class="team-btn" onclick="quickLogin('rcb','rcb2025')"><span class="t-emoji">🔴</span>RCB</div>
      <div class="team-btn" onclick="quickLogin('kkr','kkr2025')"><span class="t-emoji">🟣</span>KKR</div>
      <div class="team-btn" onclick="quickLogin('dc','dc2025')"><span class="t-emoji">💙</span>DC</div>
      <div class="team-btn" onclick="quickLogin('rr','rr2025')"><span class="t-emoji">🩵</span>RR</div>
      <div class="team-btn" onclick="quickLogin('srh','srh2025')"><span class="t-emoji">🟠</span>SRH</div>
      <div class="team-btn" onclick="quickLogin('pbks','pbks2025')"><span class="t-emoji">🔴</span>PBKS</div>
      <div class="team-btn" onclick="quickLogin('lsg','lsg2025')"><span class="t-emoji">🩵</span>LSG</div>
      <div class="team-btn" onclick="quickLogin('gt','gt2025')"><span class="t-emoji">🔵</span>GT</div>
    </div>
    <div class="special-grid">
      <div class="team-btn" onclick="quickLogin('admin','admin123')" style="border-color:#a855f7;color:#a855f7"><span class="t-emoji">👑</span>Admin</div>
      <div class="team-btn" onclick="quickLogin('analyst','analyst123')" style="border-color:#22c55e;color:#22c55e"><span class="t-emoji">📊</span>Analyst</div>
    </div>
    <div class="role-tags">
      <span class="role-tag role-admin">👑 Admin — Full Access</span>
      <span class="role-tag role-team">🏏 Team — Own Data</span>
      <span class="role-tag role-analyst">📊 Analyst — Read Only</span>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:8000';

// If already logged in redirect to home
const token = localStorage.getItem('ipl_token');
const user = localStorage.getItem('ipl_user');
if (token && user) {
  window.location.href = '/';
}

document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

function quickLogin(u, p) {
  document.getElementById('username').value = u;
  document.getElementById('password').value = p;
  doLogin();
}

async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('error-msg');
  const okEl = document.getElementById('success-msg');

  if (!username || !password) { showError('Please enter username and password'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Signing in...';
  errEl.style.display = 'none';
  okEl.style.display = 'none';

  try {
    const form = new FormData();
    form.append('username', username);
    form.append('password', password);

    const res = await fetch(`${API}/auth/login`, { method: 'POST', body: form });
    const data = await res.json();

    if (!res.ok) { showError(data.detail || 'Login failed. Check your credentials.'); return; }

    localStorage.setItem('ipl_token', data.access_token);
    localStorage.setItem('ipl_user', JSON.stringify(data.user));

    okEl.textContent = `Welcome, ${data.user.full_name}! Redirecting...`;
    okEl.style.display = 'block';

    setTimeout(() => { window.location.href = '/'; }, 800);

  } catch (err) {
    showError('Cannot connect to server. Make sure python run.py is running.');
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Sign In';
  }
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}
</script>
</body>
</html>
